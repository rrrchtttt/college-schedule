<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё расписание и задачи</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Панель дней недели */
        .week-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .day-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
            min-width: 65px;
        }

        .day-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .day-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        /* Карточки секторов */
        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Расписание */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .lesson-time {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .lesson-name {
            font-size: 15px;
            font-weight: 500;
        }

        /* Домашние задания с чекбоксами */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 15px;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .task-item.completed {
            background-color: #ecfdf5;
            border-color: #a7f3d0;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-checkbox {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
        }

        .deadline {
            color: var(--warning);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Панель управления</h1>

        <!-- Панелька дней недели с Пн по Вс -->
        <div class="week-nav">
            <div class="day-btn active" onclick="switchDay('mon')">Пн</div>
            <div class="day-btn" onclick="switchDay('tue')">Вт</div>
            <div class="day-btn" onclick="switchDay('wed')">Ср</div>
            <div class="day-btn" onclick="switchDay('thu')">Чт</div>
            <div class="day-btn" onclick="switchDay('fri')">Пт</div>
            <div class="day-btn" onclick="switchDay('sat')">Сб</div>
            <div class="day-btn" onclick="switchDay('sun')">Вс</div>
        </div>

        <!-- Блок расписания на день -->
        <div class="card">
            <div class="section-title">📅 Расписание пар (<span id="day-name">Понедельник</span>)</div>
            <div class="schedule-list">
                <div class="schedule-item">
                    <span class="lesson-time">09:00 – 10:30</span>
                    <span class="lesson-name">Государственное и муниципальное управление</span>
                </div>
                <div class="schedule-item">
                    <span class="lesson-time">10:45 – 12:15</span>
                    <span class="lesson-name">История</span>
                </div>
            </div>
        </div>

        <!-- Блок домашних заданий -->
        <div class="card">
            <div class="section-title">📝 Домашние задания</div>
            <div class="task-list">
                
                <div class="task-item">
                    <input type="checkbox" class="task-checkbox" onchange="toggleTask(this)">
                    <div class="task-content">
                        <div class="task-text">Подготовить конспект по лекции</div>
                        <div class="task-meta">
                            <span>ГМУ</span>
                            <span class="deadline">Дедлайн: Завтра, 18:00</span>
                        </div>
                    </div>
                </div>

                <div class="task-item">
                    <input type="checkbox" class="task-checkbox" onchange="toggleTask(this)">
                    <div class="task-content">
                        <div class="task-text">Повторить даты по истории для семинара</div>
                        <div class="task-meta">
                            <span>История</span>
                            <span class="deadline">Дедлайн: Среда, 10:00</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function switchDay(dayId) {
            // Переключение активной кнопки в панели
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Обновление названия дня в заголовке расписания
            const titles = {
                'mon': 'Понедельник',
                'tue': 'Вторник',
                'wed': 'Среда',
                'thu': 'Четверг',
                'fri': 'Пятница',
                'sat': 'Суббота',
                'sun': 'Воскресенье'
            };
            document.getElementById('day-name').innerText = titles[dayId];
        }

        function toggleTask(checkbox) {
            const taskItem = checkbox.closest('.task-item');
            if (checkbox.checked) {
                taskItem.classList.add('completed');
            } else {
                taskItem.classList.remove('completed');
            }
        }
    </script>

</body>
</html>
