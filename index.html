<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое расписание и задачи</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e2e8f0;
            --success: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Панель дней недели */
        .week-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .day-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
            min-width: 65px;
        }

        .day-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .day-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        /* Карточка расписания / заданий */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .day-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background-color: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .task-item.completed {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-checkbox {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .deadline {
            color: #e67e22;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Расписание и ДЗ</h1>

        <!-- Панелька дней недели с Пн по Вс -->
        <div class="week-nav">
            <div class="day-btn active" onclick="selectDay('mon')">Пн</div>
            <div class="day-btn" onclick="selectDay('tue')">Вт</div>
            <div class="day-btn" onclick="selectDay('wed')">Ср</div>
            <div class="day-btn" onclick="selectDay('thu')">Чт</div>
            <div class="day-btn" onclick="selectDay('fri')">Пт</div>
            <div class="day-btn" onclick="selectDay('sat')">Сб</div>
            <div class="day-btn" onclick="selectDay('sun')">Вс</div>
        </div>

        <!-- Контент выбранного дня -->
        <div class="card">
            <div class="day-title" id="current-day-title">Понедельник</div>
            <div class="task-list">
                
                <div class="task-item">
                    <input type="checkbox" class="task-checkbox" onchange="toggleTask(this)">
                    <div class="task-content">
                        <div class="task-text">Подготовить доклад по истории</div>
                        <div class="task-meta">
                            <span>Пара №2</span>
                            <span class="deadline">Дедлайн: Завтра, 18:00</span>
                        </div>
                    </div>
                </div>

                <div class="task-item">
                    <input type="checkbox" class="task-checkbox" onchange="toggleTask(this)">
                    <div class="task-content">
                        <div class="task-text">Решить практические задачи по профильной математике</div>
                        <div class="task-meta">
                            <span>Пара №3</span>
                            <span class="deadline">Дедлайн: Среда, 10:00</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Простой скрипт для переключения дней и чекбоксов
        function selectDay(dayId) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const titles = {
                'mon': 'Понедельник',
                'tue': 'Вторник',
                'wed': 'Среда',
                'thu': 'Четверг',
                'fri': 'Пятница',
                'sat': 'Суббота',
                'sun': 'Воскресенье'
            };
            document.getElementById('current-day-title').innerText = titles[dayId];
        }

        function toggleTask(checkbox) {
            const taskItem = checkbox.closest('.task-item');
            if (checkbox.checked) {
                taskItem.classList.add('completed');
            } else {
                taskItem.classList.remove('completed');
            }
        }
    </script>

</body>
</html>
