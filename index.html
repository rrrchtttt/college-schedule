<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание & Академический Трекер</title>
    
    <!-- PWA / iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Расписание">
    <meta name="theme-color" content="#f8fafc">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            blue: '#e0f2fe',
                            accent: '#0284c7',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b',
                            darkBorder: '#334155'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem'
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Smooth Scrollbar & Tap Highlight Removal */
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .glass-header {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-200 antialiased flex flex-col selection:bg-sky-200 dark:selection:bg-sky-900">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-30 glass-header bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-sky-500 text-white rounded-2xl shadow-md shadow-sky-500/20">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">Расписание</h1>
                    <p id="subHeaderDate" class="text-xs text-slate-500 dark:text-slate-400">Загрузка...</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-1.5">
                <button onclick="toggleTheme()" class="p-2.5 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors" title="Переключить тему">
                    <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
                </button>
                <button onclick="exportData()" class="p-2.5 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors" title="Экспорт данных">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <label class="p-2.5 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors cursor-pointer" title="Импорт данных">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                    <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
                </label>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sticky top-[61px] z-20">
        <div class="max-w-5xl mx-auto flex space-x-1 overflow-x-auto py-2 no-scrollbar">
            <button onclick="switchTab('schedule')" id="tab-schedule" class="nav-tab active flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-2xl transition-all whitespace-nowrap bg-sky-500 text-white shadow-sm">
                <i data-lucide="clock" class="w-4 h-4"></i> Расписание
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="nav-tab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-2xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap">
                <i data-lucide="calendar" class="w-4 h-4"></i> Календарь
            </button>
            <button onclick="switchTab('attendance')" id="tab-attendance" class="nav-tab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-2xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap">
                <i data-lucide="users" class="w-4 h-4"></i> Посещаемость
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-6">

        <!-- Widget: Next Pair Status -->
        <div id="nextPairWidget" class="bg-gradient-to-r from-sky-500 to-indigo-500 text-white rounded-3xl p-5 shadow-lg shadow-sky-500/15 relative overflow-hidden hidden">
            <div class="absolute -right-6 -bottom-6 opacity-15">
                <i data-lucide="bell" class="w-36 h-36"></i>
            </div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <span id="nextPairStatusBadge" class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-wider">Прямо сейчас</span>
                    <span id="nextPairTime" class="text-sm font-medium opacity-90">--:--</span>
                </div>
                <h3 id="nextPairSubject" class="text-xl font-bold">Название предмета</h3>
                <p id="nextPairMeta" class="text-sm opacity-90 mt-1 flex items-center gap-3">
                    <span><i data-lucide="map-pin" class="w-3.5 h-3.5 inline mr-1"></i><span id="nextPairRoom">---</span></span>
                    <span><i data-lucide="user" class="w-3.5 h-3.5 inline mr-1"></i><span id="nextPairTeacher">---</span></span>
                </p>
            </div>
        </div>

        <!-- TAB 1: SCHEDULE VIEW -->
        <div id="view-schedule" class="space-y-5">
            <!-- Search & Filters -->
            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
                <!-- Date Switcher -->
                <div class="flex items-center justify-between w-full sm:w-auto bg-white dark:bg-slate-800 p-1.5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700">
                    <button onclick="navigateWeek(-1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors text-slate-600 dark:text-slate-300">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="goToToday()" class="px-3 py-1.5 text-xs font-bold bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 rounded-xl hover:bg-sky-100 transition-colors">
                        Сегодня
                    </button>
                    <button onclick="navigateWeek(1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors text-slate-600 dark:text-slate-300">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Search Input -->
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderSchedule()" placeholder="Поиск предмета..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/50 transition-all">
                </div>
            </div>

            <!-- Days Navigation Ribbon -->
            <div id="weekRibbon" class="grid grid-cols-7 gap-1.5 bg-white dark:bg-slate-800 p-2 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-700 text-center">
                <!-- JS Generated Days Buttons -->
            </div>

            <!-- Timeline / Schedule Container -->
            <div id="scheduleTimeline" class="space-y-3">
                <!-- Pairs JS Generated -->
            </div>
        </div>

        <!-- TAB 2: CALENDAR VIEW -->
        <div id="view-calendar" class="hidden space-y-4">
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
                <div class="flex items-center justify-between mb-4">
                    <h2 id="calendarMonthLabel" class="text-lg font-bold">Месяц Год</h2>
                    <div class="flex items-center gap-1">
                        <button onclick="navigateMonth(-1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-slate-600 dark:text-slate-300"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <button onclick="navigateMonth(1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-slate-600 dark:text-slate-300"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                </div>

                <!-- Days of week header -->
                <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
                    <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div>
                </div>

                <!-- Month Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-sm">
                    <!-- JS Generated -->
                </div>
            </div>
        </div>

        <!-- TAB 3: ATTENDANCE VIEW -->
        <div id="view-attendance" class="hidden space-y-4">
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                        <h2 class="text-lg font-bold">Журнал посещаемости</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Отмечайте студентов и отправляйте отчеты</p>
                    </div>
                    <button onclick="copyAttendanceReport()" class="flex items-center gap-2 px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-xs font-bold shadow-md shadow-emerald-500/20 transition-all active:scale-95">
                        <i data-lucide="send" class="w-4 h-4"></i> Скопировать для Telegram
                    </button>
                </div>

                <!-- Select Subject & Date -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Предмет</label>
                        <select id="attendanceSubjectSelect" onchange="renderAttendance()" class="w-full p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none">
                            <!-- JS Populated -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Дата</label>
                        <input type="date" id="attendanceDateInput" onchange="renderAttendance()" class="w-full p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none">
                    </div>
                </div>

                <!-- Attendance Stats Banner -->
                <div class="p-4 bg-sky-50 dark:bg-sky-950/40 rounded-2xl border border-sky-100 dark:border-sky-900/50 flex justify-around text-center">
                    <div>
                        <div id="statPresent" class="text-xl font-bold text-emerald-600 dark:text-emerald-400">0</div>
                        <div class="text-[10px] uppercase font-bold text-slate-400">Присутствуют</div>
                    </div>
                    <div>
                        <div id="statAbsent" class="text-xl font-bold text-rose-600 dark:text-rose-400">0</div>
                        <div class="text-[10px] uppercase font-bold text-slate-400">Отсутствуют</div>
                    </div>
                    <div>
                        <div id="statRate" class="text-xl font-bold text-sky-600 dark:text-sky-400">100%</div>
                        <div class="text-[10px] uppercase font-bold text-slate-400">Посещаемость</div>
                    </div>
                </div>

                <!-- Student List -->
                <div class="divide-y divide-slate-100 dark:divide-slate-700/50 pt-2" id="studentList">
                    <!-- JS Populated -->
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL: PAIR DETAILS & TRELLO KANBAN -->
    <div id="pairModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200/80 dark:border-slate-700 p-6 space-y-6">
            
            <!-- Modal Header -->
            <div class="flex items-start justify-between">
                <div>
                    <span id="modalTypeBadge" class="px-2.5 py-1 bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-400 rounded-xl text-xs font-bold uppercase tracking-wider">Лекция</span>
                    <h2 id="modalSubjectTitle" class="text-2xl font-bold mt-2">Предмет</h2>
                    <p id="modalMetaInfo" class="text-sm text-slate-500 dark:text-slate-400 mt-1 flex flex-wrap gap-4">
                        <span><i data-lucide="clock" class="w-4 h-4 inline mr-1"></i><span id="modalTime">---</span></span>
                        <span><i data-lucide="map-pin" class="w-4 h-4 inline mr-1"></i><span id="modalRoom">---</span></span>
                        <span><i data-lucide="user" class="w-4 h-4 inline mr-1"></i><span id="modalTeacher">---</span></span>
                    </p>
                </div>
                <button onclick="closeModal()" class="p-2 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>

            <hr class="border-slate-100 dark:border-slate-700/60">

            <!-- Notes Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Заметки к лекции / Преподавателю</label>
                <textarea id="modalNotesInput" rows="2" placeholder="Например: Вход с правого крыла, сдать реферат..." class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/50"></textarea>
            </div>

            <!-- Trello Kanban Board -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Доска заданий (Trello)</label>
                    <button onclick="addKanbanTaskPrompt()" class="text-xs font-bold text-sky-500 hover:underline flex items-center gap-1">+ Добавить ДЗ</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <!-- Column 1: TODO -->
                    <div class="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-2xl space-y-2 border border-slate-100 dark:border-slate-800">
                        <div class="text-xs font-bold text-slate-500 flex items-center justify-between">
                            <span>НАДО СДЕЛАТЬ</span>
                            <span id="count-todo" class="px-2 py-0.5 bg-slate-200 dark:bg-slate-800 rounded-full text-[10px]">0</span>
                        </div>
                        <div id="kanban-todo" class="space-y-2 min-h-[100px]"></div>
                    </div>

                    <!-- Column 2: IN PROGRESS -->
                    <div class="bg-amber-50/50 dark:bg-amber-950/20 p-3 rounded-2xl space-y-2 border border-amber-100/50 dark:border-amber-900/30">
                        <div class="text-xs font-bold text-amber-600 dark:text-amber-400 flex items-center justify-between">
                            <span>В ПРОЦЕССЕ</span>
                            <span id="count-progress" class="px-2 py-0.5 bg-amber-100 dark:bg-amber-950 rounded-full text-[10px]">0</span>
                        </div>
                        <div id="kanban-progress" class="space-y-2 min-h-[100px]"></div>
                    </div>

                    <!-- Column 3: DONE -->
                    <div class="bg-emerald-50/50 dark:bg-emerald-950/20 p-3 rounded-2xl space-y-2 border border-emerald-100/50 dark:border-emerald-900/30">
                        <div class="text-xs font-bold text-emerald-600 dark:text-emerald-400 flex items-center justify-between">
                            <span>СДАНО</span>
                            <span id="count-done" class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-950 rounded-full text-[10px]">0</span>
                        </div>
                        <div id="kanban-done" class="space-y-2 min-h-[100px]"></div>
                    </div>
                </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex justify-end gap-3 pt-4">
                <button onclick="saveModalData()" class="px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-2xl text-sm font-bold shadow-md shadow-sky-500/20 transition-all">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- BASE DATA STRUCTURES ---
        const DEMO_PAIRS = [
            // Day 0: Monday, 1: Tuesday ... 5: Saturday
            { id: 'p1', day: 0, timeStart: '08:30', timeEnd: '10:00', name: 'Высшая математика', type: 'Лекция', room: 'Ауд. 302', teacher: 'Иванов И.И.' },
            { id: 'p2', day: 0, timeStart: '10:10', timeEnd: '11:40', name: 'Информатика и КТ', type: 'Практика', room: 'Лаб. 104', teacher: 'Петров В.С.' },
            { id: 'p3', day: 0, timeStart: '11:50', timeEnd: '13:20', name: 'Информатика и КТ', type: 'Практика (Спаренная 2/2)', room: 'Лаб. 104', teacher: 'Петров В.С.' },
            
            { id: 'p4', day: 1, timeStart: '10:10', timeEnd: '11:40', name: 'История России', type: 'Лекция', room: 'Ауд. 410', teacher: 'Сидорова А.М.' },
            { id: 'p5', day: 1, timeStart: '11:50', timeEnd: '13:20', name: 'Физическая культура', type: 'Практика', room: 'Спортзал', teacher: 'Смирнов К.Д.' },

            { id: 'p6', day: 2, timeStart: '08:30', timeEnd: '10:00', name: 'Философия', type: 'Семинар', room: 'Ауд. 215', teacher: 'Кузнецов Н.В.' },
            { id: 'p7', day: 2, timeStart: '10:10', timeEnd: '11:40', name: 'Иностранный язык', type: 'Практика', room: 'Ауд. 501', teacher: 'Браун Э.Т.' },

            { id: 'p8', day: 3, timeStart: '11:50', timeEnd: '13:20', name: 'Базы данных', type: 'Лекция', room: 'Ауд. 308', teacher: 'Васильев П.П.' },
            { id: 'p9', day: 3, timeStart: '13:40', timeEnd: '15:10', name: 'Базы данных', type: 'Лабораторная', room: 'Лаб. 102', teacher: 'Васильев П.П.' },

            { id: 'p10', day: 4, timeStart: '08:30', timeEnd: '10:00', name: 'Экономика', type: 'Лекция', room: 'Ауд. 201', teacher: 'Павлова О.С.' }
        ];

        const DEFAULT_STUDENTS = ["Алексеев М.", "Борисов Д.", "Волкова Е.", "Григорьев А.", "Дмитриев С.", "Егорова А.", "Иванов В.", "Ковалева Н."];

        // --- STATE MANAGEMENT ---
        let currentDate = new Date();
        let selectedDate = new Date();
        let activeTab = 'schedule';
        let currentModalPairId = null;

        // Horizon limit: Only allow dates within +- 14 days from Today
        const MAX_HORIZON_DAYS = 14;

        // LocalStorage Caches
        let appData = {
            notes: JSON.parse(localStorage.getItem('app_notes') || '{}'),
            kanban: JSON.parse(localStorage.getItem('app_kanban') || '{}'),
            attendance: JSON.parse(localStorage.getItem('app_attendance') || '{}')
        };

        // --- INIT & CYCLE ---
        window.onload = () => {
            initTheme();
            renderSubHeader();
            renderWeekRibbon();
            renderSchedule();
            updateNextPairWidget();
            populateAttendanceSelectors();
            lucide.createIcons();
            setInterval(updateNextPairWidget, 30000); // Check current pair every 30s
        };

        // --- THEME SYSTEM ---
        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        // --- NAVIGATION TABS ---
        function switchTab(tab) {
            activeTab = tab;
            ['schedule', 'calendar', 'attendance'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "nav-tab active flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-2xl transition-all whitespace-nowrap bg-sky-500 text-white shadow-sm";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "nav-tab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-2xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap";
                    view.classList.add('hidden');
                }
            });

            if (tab === 'calendar') renderCalendar();
            if (tab === 'attendance') renderAttendance();
        }

        // --- DATE HELPERS ---
        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function isWithinPlanningHorizon(targetDate) {
            const diffTime = Math.abs(targetDate - currentDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays <= MAX_HORIZON_DAYS;
        }

        function renderSubHeader() {
            const options = { month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('subHeaderDate').innerText = selectedDate.toLocaleDateString('ru-RU', options);
        }

        function navigateWeek(direction) {
            const nextDate = new Date(selectedDate);
            nextDate.setDate(nextDate.getDate() + (direction * 7));
            selectedDate = nextDate;
            renderSubHeader();
            renderWeekRibbon();
            renderSchedule();
        }

        function goToToday() {
            selectedDate = new Date();
            renderSubHeader();
            renderWeekRibbon();
            renderSchedule();
        }

        // --- WEEK RIBBON ---
        function renderWeekRibbon() {
            const ribbon = document.getElementById('weekRibbon');
            ribbon.innerHTML = '';

            const monday = getMonday(selectedDate);
            const daysShort = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);

                const isSelected = isSameDay(dayDate, selectedDate);
                const isToday = isSameDay(dayDate, currentDate);

                const btn = document.createElement('button');
                btn.onclick = () => {
                    selectedDate = dayDate;
                    renderSubHeader();
                    renderWeekRibbon();
                    renderSchedule();
                };

                btn.className = `p-2 rounded-2xl flex flex-col items-center justify-center transition-all ${
                    isSelected 
                        ? 'bg-sky-500 text-white font-bold shadow-md shadow-sky-500/20' 
                        : isToday 
                            ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-600 dark:text-sky-400 font-bold' 
                            : 'hover:bg-slate-100 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300'
                }`;

                btn.innerHTML = `
                    <span class="text-[10px] uppercase opacity-75">${daysShort[i]}</span>
                    <span class="text-sm font-semibold">${dayDate.getDate()}</span>
                `;
                ribbon.appendChild(btn);
            }
        }

        // --- RENDER SCHEDULE TIMELINE ---
        function renderSchedule() {
            const timeline = document.getElementById('scheduleTimeline');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            timeline.innerHTML = '';

            // 1. Check Horizon Planning Limit
            if (!isWithinPlanningHorizon(selectedDate)) {
                timeline.innerHTML = `
                    <div class="text-center py-12 px-4 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200/80 dark:border-slate-700">
                        <div class="inline-p-3 p-3 bg-slate-100 dark:bg-slate-700 rounded-full mb-3 text-slate-400">
                            <i data-lucide="calendar-x" class="w-8 h-8 mx-auto"></i>
                        </div>
                        <h3 class="font-bold text-slate-700 dark:text-slate-200">Расписание еще не загружено</h3>
                        <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Горизонт планирования ограничен 2 неделями. Вернитесь к актуальным датам.</p>
                        <button onclick="goToToday()" class="mt-4 px-4 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl shadow-sm">Вернуться к сегодня</button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // 2. Filter pairs for selected day
            const jsDay = selectedDate.getDay();
            const dayIndex = jsDay === 0 ? 6 : jsDay - 1; // Convert to Mon-0, Sun-6

            let dayPairs = DEMO_PAIRS.filter(p => p.day === dayIndex);

            if (searchVal) {
                dayPairs = dayPairs.filter(p => 
                    p.name.toLowerCase().includes(searchVal) || 
                    p.teacher.toLowerCase().includes(searchVal) || 
                    p.room.toLowerCase().includes(searchVal)
                );
            }

            if (dayPairs.length === 0) {
                timeline.innerHTML = `
                    <div class="text-center py-12 px-4 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200/80 dark:border-slate-700">
                        <i data-lucide="coffee" class="w-10 h-10 mx-auto text-slate-300 dark:text-slate-600 mb-2"></i>
                        <p class="text-sm font-semibold text-slate-500">Пар нет, можно отдыхать!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Calculate current time status if today
            const now = new Date();
            const isToday = isSameDay(selectedDate, now);
            const nowMinutes = now.getHours() * 60 + now.getMinutes();

            dayPairs.sort((a,b) => a.timeStart.localeCompare(b.timeStart)).forEach(pair => {
                const [hStart, mStart] = pair.timeStart.split(':').map(Number);
                const [hEnd, mEnd] = pair.timeEnd.split(':').map(Number);
                const startMins = hStart * 60 + mStart;
                const endMins = hEnd * 60 + mEnd;

                let stateClass = "bg-white dark:bg-slate-800 border-slate-200/80 dark:border-slate-700";
                let badgeHTML = `<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-medium">${pair.type}</span>`;

                if (isToday) {
                    if (nowMinutes >= startMins && nowMinutes <= endMins) {
                        // Ongoing pair
                        stateClass = "bg-sky-50/90 dark:bg-sky-950/40 border-sky-300 dark:border-sky-800 ring-2 ring-sky-500/30";
                        badgeHTML = `<span class="px-2.5 py-1 bg-sky-500 text-white rounded-xl text-xs font-bold animate-pulse">Прямо сейчас</span>`;
                    } else if (nowMinutes > endMins) {
                        // Passed pair
                        stateClass = "bg-white/60 dark:bg-slate-800/40 border-slate-200/50 dark:border-slate-800 opacity-60";
                    }
                }

                // Check Kanban Tasks Count
                const kanbanData = appData.kanban[pair.id] || { todo: [], progress: [], done: [] };
                const pendingTasks = (kanbanData.todo?.length || 0) + (kanbanData.progress?.length || 0);

                const card = document.createElement('div');
                card.onclick = () => openModal(pair.id);
                card.className = `p-4 rounded-3xl border transition-all hover:shadow-md cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${stateClass}`;

                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="text-center sm:text-left min-w-[70px]">
                            <div class="text-sm font-bold text-slate-800 dark:text-slate-100">${pair.timeStart}</div>
                            <div class="text-xs text-slate-400">${pair.timeEnd}</div>
                        </div>
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                ${badgeHTML}
                                <h4 class="font-bold text-base text-slate-800 dark:text-slate-100">${pair.name}</h4>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 flex flex-wrap gap-3 pt-1">
                                <span><i data-lucide="map-pin" class="w-3.5 h-3.5 inline mr-1"></i>${pair.room}</span>
                                <span><i data-lucide="user" class="w-3.5 h-3.5 inline mr-1"></i>${pair.teacher}</span>
                            </p>
                        </div>
                    </div>
                    ${pendingTasks > 0 ? `
                        <div class="self-start sm:self-center px-3 py-1 bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 text-xs font-bold rounded-xl flex items-center gap-1.5">
                            <i data-lucide="check-square" class="w-3.5 h-3.5"></i> ${pendingTasks} ДЗ
                        </div>
                    ` : ''}
                `;
                timeline.appendChild(card);
            });

            lucide.createIcons();
        }

        // --- NEXT PAIR WIDGET LOGIC ---
        function updateNextPairWidget() {
            const widget = document.getElementById('nextPairWidget');
            const now = new Date();
            const jsDay = now.getDay();
            const dayIndex = jsDay === 0 ? 6 : jsDay - 1;
            const nowMins = now.getHours() * 60 + now.getMinutes();

            const todaysPairs = DEMO_PAIRS.filter(p => p.day === dayIndex);
            let currentOrNext = null;
            let isCurrent = false;

            for (let pair of todaysPairs) {
                const [hStart, mStart] = pair.timeStart.split(':').map(Number);
                const [hEnd, mEnd] = pair.timeEnd.split(':').map(Number);
                const startMins = hStart * 60 + mStart;
                const endMins = hEnd * 60 + mEnd;

                if (nowMins >= startMins && nowMins <= endMins) {
                    currentOrNext = pair;
                    isCurrent = true;
                    break;
                } else if (nowMins < startMins) {
                    currentOrNext = pair;
                    isCurrent = false;
                    break;
                }
            }

            if (currentOrNext) {
                widget.classList.remove('hidden');
                document.getElementById('nextPairStatusBadge').innerText = isCurrent ? "Прямо сейчас" : "Следующая пара";
                document.getElementById('nextPairTime').innerText = `${currentOrNext.timeStart} - ${currentOrNext.timeEnd}`;
                document.getElementById('nextPairSubject').innerText = currentOrNext.name;
                document.getElementById('nextPairRoom').innerText = currentOrNext.room;
                document.getElementById('nextPairTeacher').innerText = currentOrNext.teacher;
            } else {
                widget.classList.add('hidden');
            }
        }

        // --- CALENDAR VIEW ---
        let calMonth = new Date().getMonth();
        let calYear = new Date().getFullYear();

        function renderCalendar() {
            const label = document.getElementById('calendarMonthLabel');
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            label.innerText = `${monthNames[calMonth]} ${calYear}`;

            const firstDay = new Date(calYear, calMonth, 1);
            const lastDay = new Date(calYear, calMonth + 1, 0);

            let startingDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            // Empty slots for previous month
            for (let i = 0; i < startingDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            // Days of current month
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const cellDate = new Date(calYear, calMonth, day);
                const cellBtn = document.createElement('button');

                const isToday = isSameDay(cellDate, currentDate);
                const isSelected = isSameDay(cellDate, selectedDate);

                cellBtn.onclick = () => {
                    selectedDate = cellDate;
                    switchTab('schedule');
                    renderWeekRibbon();
                    renderSchedule();
                };

                cellBtn.className = `h-12 rounded-2xl flex flex-col items-center justify-center transition-all ${
                    isSelected 
                        ? 'bg-sky-500 text-white font-bold' 
                        : isToday 
                            ? 'bg-sky-100 dark:bg-sky-950 text-sky-600 font-bold' 
                            : 'hover:bg-slate-100 dark:hover:bg-slate-700/50 text-slate-700 dark:text-slate-200'
                }`;

                cellBtn.innerHTML = `<span>${day}</span>`;
                grid.appendChild(cellBtn);
            }
        }

        function navigateMonth(dir) {
            calMonth += dir;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            if (calMonth > 11) { calMonth = 0; calYear++; }
            renderCalendar();
        }

        // --- ATTENDANCE VIEW ---
        function populateAttendanceSelectors() {
            const select = document.getElementById('attendanceSubjectSelect');
            select.innerHTML = '';
            
            // Unique subjects
            const uniqueSubjects = [...new Set(DEMO_PAIRS.map(p => p.name))];
            uniqueSubjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                select.appendChild(opt);
            });

            document.getElementById('attendanceDateInput').value = new Date().toISOString().split('T')[0];
        }

        function renderAttendance() {
            const subject = document.getElementById('attendanceSubjectSelect').value;
            const date = document.getElementById('attendanceDateInput').value;
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = '';

            const key = `${date}_${subject}`;
            const currentAttendance = appData.attendance[key] || {};

            let presentCount = 0;
            let absentCount = 0;

            DEFAULT_STUDENTS.forEach((student, idx) => {
                const status = currentAttendance[student] || 'present'; // 'present', 'absent', 'late', 'excused'
                if (status === 'present') presentCount++;
                else absentCount++;

                const item = document.createElement('div');
                item.className = "py-3 flex items-center justify-between gap-2";
                item.innerHTML = `
                    <span class="text-sm font-medium text-slate-800 dark:text-slate-200">${idx + 1}. ${student}</span>
                    <div class="flex items-center gap-1">
                        <button onclick="setAttendanceStatus('${key}', '${student}', 'present')" class="px-2.5 py-1 rounded-xl text-xs font-bold transition-all ${status === 'present' ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'}">Был</button>
                        <button onclick="setAttendanceStatus('${key}', '${student}', 'absent')" class="px-2.5 py-1 rounded-xl text-xs font-bold transition-all ${status === 'absent' ? 'bg-rose-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'}">Н/Б</button>
                        <button onclick="setAttendanceStatus('${key}', '${student}', 'late')" class="px-2.5 py-1 rounded-xl text-xs font-bold transition-all ${status === 'late' ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'}">Опоздал</button>
                    </div>
                `;
                studentList.appendChild(item);
            });

            document.getElementById('statPresent').innerText = presentCount;
            document.getElementById('statAbsent').innerText = absentCount;
            const rate = DEFAULT_STUDENTS.length ? Math.round((presentCount / DEFAULT_STUDENTS.length) * 100) : 100;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        function setAttendanceStatus(key, student, status) {
            if (!appData.attendance[key]) appData.attendance[key] = {};
            appData.attendance[key][student] = status;
            localStorage.setItem('app_attendance', JSON.stringify(appData.attendance));
            renderAttendance();
        }

        function copyAttendanceReport() {
            const subject = document.getElementById('attendanceSubjectSelect').value;
            const date = document.getElementById('attendanceDateInput').value;
            const key = `${date}_${subject}`;
            const currentAttendance = appData.attendance[key] || {};

            const absentList = DEFAULT_STUDENTS.filter(s => currentAttendance[s] === 'absent');
            const lateList = DEFAULT_STUDENTS.filter(s => currentAttendance[s] === 'late');

            let report = `📊 *Рапортичка посещаемости*\n📅 Дата: ${date}\n📚 Предмет: ${subject}\n\n`;
            
            if (absentList.length > 0) {
                report += `❌ *Отсутствуют (${absentList.length}):*\n` + absentList.map(s => `• ${s}`).join('\n') + '\n\n';
            } else {
                report += `✅ *Отсутствующих нет!*\n\n`;
            }

            if (lateList.length > 0) {
                report += `⚠️ *Опоздали (${lateList.length}):*\n` + lateList.map(s => `• ${s}`).join('\n');
            }

            navigator.clipboard.writeText(report).then(() => {
                alert("Отчёт о посещаемости скопирован в буфер обмена!");
            });
        }

        // --- MODAL & TRELLO KANBAN ---
        function openModal(pairId) {
            currentModalPairId = pairId;
            const pair = DEMO_PAIRS.find(p => p.id === pairId);
            if (!pair) return;

            document.getElementById('modalTypeBadge').innerText = pair.type;
            document.getElementById('modalSubjectTitle').innerText = pair.name;
            document.getElementById('modalTime').innerText = `${pair.timeStart} - ${pair.timeEnd}`;
            document.getElementById('modalRoom').innerText = pair.room;
            document.getElementById('modalTeacher').innerText = pair.teacher;

            document.getElementById('modalNotesInput').value = appData.notes[pairId] || '';

            renderKanbanBoard(pairId);
            document.getElementById('pairModal').classList.remove('hidden');
            document.getElementById('pairModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('pairModal').classList.add('hidden');
            document.getElementById('pairModal').classList.remove('flex');
            currentModalPairId = null;
        }

        function saveModalData() {
            if (!currentModalPairId) return;
            const noteText = document.getElementById('modalNotesInput').value;
            appData.notes[currentModalPairId] = noteText;
            localStorage.setItem('app_notes', JSON.stringify(appData.notes));
            closeModal();
            renderSchedule();
        }

        function renderKanbanBoard(pairId) {
            const data = appData.kanban[pairId] || { todo: [], progress: [], done: [] };

            ['todo', 'progress', 'done'].forEach(col => {
                const container = document.getElementById(`kanban-${col}`);
                const countBadge = document.getElementById(`count-${col}`);
                container.innerHTML = '';
                
                const tasks = data[col] || [];
                countBadge.innerText = tasks.length;

                tasks.forEach((task, idx) => {
                    const card = document.createElement('div');
                    card.className = "p-2.5 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200/60 dark:border-slate-700/60 text-xs space-y-2";
                    
                    const isDone = col === 'done';
                    card.innerHTML = `
                        <div class="font-medium text-slate-800 dark:text-slate-200 ${isDone ? 'line-through opacity-60' : ''}">${task.title}</div>
                        <div class="flex justify-between items-center text-[10px] text-slate-400">
                            <span>${task.date || 'Без дедлайна'}</span>
                            <div class="flex gap-1">
                                ${col !== 'todo' ? `<button onclick="moveKanbanTask('${pairId}', '${col}', 'todo',${idx})" class="hover:text-sky-500">←</button>` : ''}
                                ${col !== 'progress' ? `<button onclick="moveKanbanTask('${pairId}', '${col}', 'progress',${idx})" class="hover:text-amber-500">⏳</button>` : ''}
                                ${col !== 'done' ? `<button onclick="moveKanbanTask('${pairId}', '${col}', 'done',${idx})" class="hover:text-emerald-500">✓</button>` : ''}
                                <button onclick="deleteKanbanTask('${pairId}', '${col}', ${idx})" class="hover:text-rose-500 ml-1">✕</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function addKanbanTaskPrompt() {
            if (!currentModalPairId) return;
            const title = prompt("Введите описание задания (ДЗ):");
            if (!title) return;

            if (!appData.kanban[currentModalPairId]) {
                appData.kanban[currentModalPairId] = { todo: [], progress: [], done: [] };
            }

            appData.kanban[currentModalPairId].todo.push({
                title: title,
                date: new Date().toLocaleDateString('ru-RU', { month: 'short', day: 'numeric' })
            });

            localStorage.setItem('app_kanban', JSON.stringify(appData.kanban));
            renderKanbanBoard(currentModalPairId);
        }

        function moveKanbanTask(pairId, fromCol, toCol, index) {
            const task = appData.kanban[pairId][fromCol].splice(index, 1)[0];
            appData.kanban[pairId][toCol].push(task);
            localStorage.setItem('app_kanban', JSON.stringify(appData.kanban));
            renderKanbanBoard(pairId);
        }

        function deleteKanbanTask(pairId, col, index) {
            appData.kanban[pairId][col].splice(index, 1);
            localStorage.setItem('app_kanban', JSON.stringify(appData.kanban));
            renderKanbanBoard(pairId);
        }

        // --- EXPORT / IMPORT DATA ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `schedule_backup_${new Date().toISOString().split('T')[0]}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.notes) localStorage.setItem('app_notes', JSON.stringify(imported.notes));
                    if (imported.kanban) localStorage.setItem('app_kanban', JSON.stringify(imported.kanban));
                    if (imported.attendance) localStorage.setItem('app_attendance', JSON.stringify(imported.attendance));
                    alert("Данные успешно импортированы!");
                    location.reload();
                } catch (err) {
                    alert("Ошибка при импорте файла.");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
