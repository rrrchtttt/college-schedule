<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание занятий | БГО-101</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            display: none;
        }
        @media (min-width: 768px) {
            .custom-scrollbar::-webkit-scrollbar {
                display: block;
            }
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        /* Анимации перехода */
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

    <!-- Главный контейнер -->
    <div class="w-full max-w-2xl px-4 pt-6 space-y-6">

        <!-- Шапка -->
        <header class="flex items-center justify-between bg-white/70 backdrop-blur-md p-5 rounded-3xl shadow-sm border border-white/60">
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-500 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">МЭИ • БГО-101</span>
                <h1 class="text-2xl font-bold text-slate-800 mt-1">Расписание</h1>
            </div>
            <button onclick="goToToday()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-4 py-2.5 rounded-2xl transition-all shadow-sm active:scale-95 text-sm">
                <i data-lucide="calendar" class="w-4 h-4 text-blue-500"></i>
                <span>Сегодня</span>
            </button>
        </header>

        <!-- Навигация по неделе -->
        <section class="bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-sm border border-white/60 space-y-4">
            <!-- Панель управления неделями -->
            <div class="flex items-center justify-between px-2">
                <button onclick="changeWeek(-1)" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all active:scale-95">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <div class="text-center">
                    <div id="weekLabel" class="text-sm font-semibold text-slate-800"></div>
                    <div id="dateRangeLabel" class="text-xs text-slate-500 font-medium mt-0.5"></div>
                </div>
                <button onclick="changeWeek(1)" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all active:scale-95">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Дни недели (Дни-карточки) -->
            <div id="daysContainer" class="grid grid-cols-7 gap-1.5 sm:gap-2">
                <!-- Генерируется через JS -->
            </div>
        </section>

        <!-- Заголовок выбранного дня -->
        <div class="flex items-center justify-between px-2 pt-2">
            <h2 id="selectedDayTitle" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <!-- Заголовок дня -->
            </h2>
            <span id="pairsCount" class="text-xs font-medium text-slate-400"></span>
        </div>

        <!-- Список пар выбранного дня -->
        <main id="scheduleContainer" class="space-y-4 fade-in">
            <!-- Карточки пар генерируются здесь -->
        </main>
    </div>

    <!-- JavaScript Логика -->
    <script>
        // БАЗА ДАННЫХ РАСПИСАНИЯ МЭИ (БГО-101)
        const baseSchedule = {
            // Неделя 1 (28.09.26 - 04.10.26)
            1: {
                1: [ // Пн
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Физическая культура и спорт", type: "Лекция", room: "409", teacher: "Фирсин С.А." },
                    { num: 4, time: "14:20 – 15:50", endTime: "15:50", name: "День самоподготовки", type: "Самостоятельно", room: "-", teacher: "-" }
                ],
                2: [ // Вт
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Философия", type: "Лекция", room: "210", teacher: "Заклинский П.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Философия", type: "Лекция", room: "210", teacher: "Заклинский П.А." }
                ],
                3: [ // Ср
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Основы российской государственности", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Основы российской государственности", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "История России", type: "Лекция", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                4: [ // Чт
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "Основы нравственности и воспитания (НКО)", type: "Лекция", room: "210", teacher: "Волович И.Г." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." }
                ],
                5: [ // Пт
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "Экономическая теория", type: "Лекция", room: "409", teacher: "Башашкина Г.Ю." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "Иностранный язык", type: "Лекция", room: "401", teacher: "Пенькова Е.А." }
                ],
                6: [], // Сб
                0: []  // Вс
            },
            // Неделя 2 (05.10.26 - 11.10.26)
            2: {
                1: [ // Пн
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Физическая культура и спорт", type: "Практика", room: "409", teacher: "Фирсин С.А." },
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Безопасность жизнедеятельности", type: "Практика", room: "205", teacher: "Макаршин И.В." }
                ],
                2: [ // Вт
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." }
                ],
                3: [ // Ср
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Русский язык и культура речи", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Русский язык и культура речи", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "История России", type: "Лекция", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                4: [ // Чт
                    { num: "2-3", time: "10:40 – 14:10", endTime: "14:10", name: "Экономическая теория", type: "Практика", room: "401", teacher: "Башашкина Г.Ю." },
                    { num: 4, time: "14:20 – 15:50", endTime: "15:50", name: "Основы нравственности и воспитания (НКО)", type: "Лекция", room: "210", teacher: "Волович И.Г." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "История России", type: "Практика", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                5: [ // Пт
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Иностранный язык", type: "Практика", room: "401", teacher: "Пенькова Е.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Безопасность жизнедеятельности", type: "Лекция", room: "210", teacher: "Макаршин И.В." },
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Безопасность жизнедеятельности", type: "Лекция", room: "210", teacher: "Макаршин И.В." }
                ],
                6: [ // Сб
                    { num: "1-2", time: "09:00 – 12:10", endTime: "12:10", name: "Основы нравственности и воспитания (НКО)", type: "Практика", room: "210", teacher: "Волович И.Г." }
                ],
                0: []  // Вс
            }
        };

        // Состояние приложения
        let currentDate = new Date();
        let selectedDate = new Date();

        // Дата старта 1-й недели семестра: 28 сентября 2026
        const semesterStartDate = new Date(2026, 8, 28); 

        const dayNames = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        const fullDayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        // Инициализация
        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
            setInterval(updateRealtimeStatus, 60000); // Проверка статуса пар каждую минуту
        });

        // Расчет номера недели (1 или 2)
        function getWeekNumber(date) {
            const diffTime = date - semesterStartDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 1;
            const weekIndex = Math.floor(diffDays / 7) % 2;
            return weekIndex === 0 ? 1 : 2;
        }

        // Главный рендер
        function renderApp() {
            renderHeaderAndDays();
            renderSchedule();
            lucide.createIcons();
        }

        // Рендер навигационной панели
        function renderHeaderAndDays() {
            const currentWeekNum = getWeekNumber(selectedDate);
            document.getElementById("weekLabel").innerText = `Неделя ${currentWeekNum}`;

            // Вычисление понедельника выбранной недели
            const startOfWeek = new Date(selectedDate);
            const day = startOfWeek.getDay();
            const diffToMon = (day === 0 ? -6 : 1) - day;
            startOfWeek.setDate(startOfWeek.getDate() + diffToMon);

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);

            // Диапазон дат
            const formatDateShort = (d) => `${d.getDate()} ${d.toLocaleString('ru', { month: 'short' }).replace('.', '')}`;
            document.getElementById("dateRangeLabel").innerText = `${formatDateShort(startOfWeek)} – ${formatDateShort(endOfWeek)}`;

            // Генерация плашек дней
            const daysContainer = document.getElementById("daysContainer");
            daysContainer.innerHTML = "";

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(dayDate.getDate() + i);

                const isToday = isSameDay(dayDate, currentDate);
                const isSelected = isSameDay(dayDate, selectedDate);

                const dayOfWeekIdx = dayDate.getDay();
                const dayBtn = document.createElement("button");
                dayBtn.onclick = () => {
                    selectedDate = new Date(dayDate);
                    renderApp();
                };

                let styleClasses = "flex flex-col items-center justify-center p-2 sm:p-2.5 rounded-2xl transition-all cursor-pointer font-medium ";
                if (isSelected) {
                    styleClasses += "bg-blue-500 text-white shadow-md shadow-blue-200 scale-105 ";
                } else if (isToday) {
                    styleClasses += "bg-blue-100/70 text-blue-700 border border-blue-200 hover:bg-blue-100 ";
                } else {
                    styleClasses += "bg-slate-100/70 text-slate-600 hover:bg-slate-200/70 ";
                }

                dayBtn.className = styleClasses;
                dayBtn.innerHTML = `
                    <span class="text-[10px] sm:text-xs opacity-80 uppercase">${dayNames[dayOfWeekIdx]}</span>
                    <span class="text-sm sm:text-base font-bold">${dayDate.getDate()}</span>
                `;
                daysContainer.appendChild(dayBtn);
            }

            // Заголовок карточки
            const selectedDayIdx = selectedDate.getDay();
            document.getElementById("selectedDayTitle").innerHTML = `
                <span>${fullDayNames[selectedDayIdx]}</span>
                <span class="text-sm font-normal text-slate-400">, ${selectedDate.getDate()} ${selectedDate.toLocaleString('ru', { month: 'long' })}</span>
            `;
        }

        // Рендер списка пар
        function renderSchedule() {
            const container = document.getElementById("scheduleContainer");
            container.innerHTML = "";

            const weekNum = getWeekNumber(selectedDate);
            const dayIdx = selectedDate.getDay();
            const pairs = baseSchedule[weekNum]?.[dayIdx] || [];

            document.getElementById("pairsCount").innerText = pairs.length ? `${pairs.length} пары` : "Нет занятий";

            if (pairs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white/80 backdrop-blur-md rounded-3xl p-8 text-center border border-white/60 shadow-sm space-y-3">
                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto text-blue-400">
                            <i data-lucide="coffee" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-600 font-semibold">На этот день пар нет!</p>
                        <p class="text-slate-400 text-xs">Время отдохнуть или сделать домашку.</p>
                    </div>
                `;
                return;
            }

            pairs.forEach((pair, index) => {
                const pairId = `hw_w${weekNum}_d${dayIdx}_p${pair.num}_${index}`;
                const savedHw = localStorage.getItem(pairId) || "";

                const status = getPairStatus(pair, selectedDate);
                const card = document.createElement("div");

                // Оформление карточек в зависимости от статуса
                let cardStyle = "bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-sm border transition-all space-y-3 relative ";
                
                if (status === "current") {
                    cardStyle += "border-blue-400 ring-4 ring-blue-100 shadow-md bg-blue-50/30 ";
                } else if (status === "passed") {
                    cardStyle += "border-slate-100 opacity-60 bg-slate-50/50 ";
                } else {
                    cardStyle += "border-white/80 hover:shadow-md ";
                }

                card.className = cardStyle;

                // Пастельные бейджи типов
                let badgeStyle = "bg-slate-100 text-slate-600";
                if (pair.type === "Лекция") badgeStyle = "bg-blue-100 text-blue-700 border border-blue-200/50";
                if (pair.type === "Практика") badgeStyle = "bg-emerald-100 text-emerald-700 border border-emerald-200/50";
                if (pair.type === "Самостоятельно") badgeStyle = "bg-amber-100 text-amber-700 border border-amber-200/50";

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-xl ${badgeStyle}">
                                    ${pair.type}
                                </span>
                                ${status === "current" ? `
                                    <span class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-100 px-2.5 py-1 rounded-xl animate-pulse">
                                        <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span> Идет сейчас
                                    </span>
                                ` : ''}
                            </div>
                            <h3 class="text-base font-bold text-slate-800 pt-1">${pair.name}</h3>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <span class="text-xs font-bold text-slate-400 block">№ ${pair.num}</span>
                            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg border border-blue-100 mt-1 inline-block">до ${pair.endTime}</span>
                        </div>
                    </div>

                    <!-- Детали (Время, Кабинет, Преподаватель) -->
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 pt-1 border-t border-slate-100">
                        <div class="flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>${pair.time}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>Ауд. <strong class="text-slate-700">${pair.room}</strong></span>
                        </div>
                        ${pair.teacher !== "-" ? `
                            <div class="flex items-center gap-1.5 col-span-2">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>${pair.teacher}</span>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Поле Домашнего Задания -->
                    <div class="pt-2 border-t border-slate-100/80">
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-square" class="w-4 h-4 ${savedHw ? 'text-blue-500' : 'text-slate-300'}"></i>
                            <input 
                                type="text" 
                                id="${pairId}"
                                value="${escapeHtml(savedHw)}"
                                placeholder="Добавить домашку..."
                                onblur="saveHomework('${pairId}', this.value)"
                                onkeypress="if(event.key==='Enter') this.blur()"
                                class="w-full text-xs bg-slate-50/80 hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 px-3 py-2 rounded-xl border border-slate-200/60 focus:border-blue-400 focus:outline-none transition-all"
                            />
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Сохранение домашки в localStorage
        function saveHomework(id, text) {
            if (text.trim()) {
                localStorage.setItem(id, text.trim());
            } else {
                localStorage.removeItem(id);
            }
            renderSchedule();
            lucide.createIcons();
        }

        // Определение статуса пары (идет / прошла / еще будет)
        function getPairStatus(pair, targetDate) {
            if (!isSameDay(targetDate, currentDate)) {
                return "future";
            }

            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            // Парсим время пары
            const [startStr, endStr] = pair.time.split("–").map(s => s.trim());
            const [startH, startM] = startStr.split(":").map(Number);
            const [endH, endM] = endStr.split(":").map(Number);

            const startMinutes = startH * 60 + startM;
            const endMinutes = endH * 60 + endM;

            if (currentMinutes >= startMinutes && currentMinutes <= endMinutes) {
                return "current";
            } else if (currentMinutes > endMinutes) {
                return "passed";
            } else {
                return "future";
            }
        }

        // Навигация
        function changeWeek(direction) {
            selectedDate.setDate(selectedDate.getDate() + (direction * 7));
            renderApp();
        }

        function goToToday() {
            currentDate = new Date();
            selectedDate = new Date();
            renderApp();
        }

        // Автообновление в реальном времени
        function updateRealtimeStatus() {
            currentDate = new Date();
            renderSchedule();
            lucide.createIcons();
        }

        // Вспомогательные функции
        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
