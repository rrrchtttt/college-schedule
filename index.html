<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание | БГО-101</title>

    <!-- PWA / Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="БГО-101">
    <meta name="theme-color" content="#f0f4f8" id="theme-color-meta">
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/calendar.png">

    <!-- Tailwind CSS CDN & Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastelBgLight: '#f0f4f8',
                        pastelBgDark: '#0f172a',
                        pastelCardLight: 'rgba(255, 255, 255, 0.85)',
                        pastelCardDark: 'rgba(30, 41, 59, 0.85)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts (Inter) & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-pastelBgLight dark:bg-pastelBgDark text-slate-800 dark:text-slate-100 min-h-screen pb-12 flex flex-col items-center">

    <!-- Главный контейнер -->
    <div class="w-full max-w-2xl px-4 pt-4 space-y-5">

        <!-- Верхняя панель (Шапка) -->
        <header class="flex items-center justify-between bg-white/70 dark:bg-slate-800/70 backdrop-blur-md p-4 sm:p-5 rounded-3xl shadow-sm border border-white/60 dark:border-slate-700/60">
            <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 px-3 py-1 rounded-full border border-blue-100 dark:border-blue-900/50">МЭИ • БГО-101</span>
                <h1 class="text-xl sm:text-2xl font-bold mt-1">Расписание</h1>
            </div>

            <!-- Кнопки управления шапки -->
            <div class="flex items-center gap-2">
                <!-- Переключатель темы -->
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95" title="Переключить тему">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
                </button>
                <!-- Настройки / Данные -->
                <button onclick="openDataModal()" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95" title="Экспорт/Импорт">
                    <i data-lucide="hard-drive" class="w-4 h-4"></i>
                </button>
                <!-- Сегодня -->
                <button onclick="goToToday()" class="flex items-center gap-1.5 bg-blue-500 hover:bg-blue-600 text-white font-medium px-3.5 py-2.5 rounded-2xl transition-all shadow-sm active:scale-95 text-xs sm:text-sm">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>Сегодня</span>
                </button>
            </div>
        </header>

        <!-- Виджет «Следующая пара» -->
        <div id="nextPairWidget" class="hidden bg-gradient-to-r from-blue-500 to-indigo-500 text-white p-4 rounded-3xl shadow-md border border-blue-400/30 space-y-1 fade-in">
            <!-- Динамический контент из JS -->
        </div>

        <!-- Поиск и фильтрация -->
        <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-4 top-3.5 text-slate-400"></i>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Поиск по предмету, ауд. или препу..." 
                oninput="onSearchInput(this.value)"
                class="w-full pl-10 pr-4 py-2.5 text-xs sm:text-sm bg-white/80 dark:bg-slate-800/80 backdrop-blur-md rounded-2xl border border-white/60 dark:border-slate-700/60 focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 dark:text-slate-100 placeholder-slate-400 shadow-sm"
            />
        </div>

        <!-- Панель выбора недели и дней -->
        <section class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-3.5 sm:p-4 rounded-3xl shadow-sm border border-white/60 dark:border-slate-700/60 space-y-3">
            <div class="flex items-center justify-between px-2">
                <button onclick="changeWeek(-1)" class="p-2 rounded-2xl bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="text-center">
                    <div id="weekLabel" class="text-xs sm:text-sm font-semibold"></div>
                    <div id="dateRangeLabel" class="text-[11px] text-slate-400 font-medium mt-0.5"></div>
                </div>
                <button onclick="changeWeek(1)" class="p-2 rounded-2xl bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Сетка дней недели -->
            <div id="daysContainer" class="grid grid-cols-7 gap-1 sm:gap-2">
                <!-- Генерируется из JS -->
            </div>
        </section>

        <!-- Заголовок выбранного дня -->
        <div class="flex items-center justify-between px-2 pt-1">
            <h2 id="selectedDayTitle" class="text-base sm:text-lg font-bold flex items-center gap-2"></h2>
            <span id="pairsCount" class="text-xs font-medium text-slate-400"></span>
        </div>

        <!-- Список пар -->
        <main id="scheduleContainer" class="space-y-3.5 fade-in">
            <!-- Карточки генерируются из JS -->
        </main>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗАМЕТОК -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 fade-in">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-md shadow-xl border border-white/40 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="noteModalTitle" class="text-base font-bold">Заметка</h3>
                <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <textarea id="noteInput" rows="4" placeholder="Напишите важное (аудитория, контакты, сдать реферат...)" class="w-full text-xs sm:text-sm p-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 dark:text-slate-100"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeNoteModal()" class="px-4 py-2 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Отмена</button>
                <button onclick="saveNote()" class="px-4 py-2 rounded-xl text-xs font-medium bg-blue-500 hover:bg-blue-600 text-white shadow-sm">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДАННЫХ (Экспорт / Импорт) -->
    <div id="dataModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 fade-in">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-md shadow-xl border border-white/40 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold">Управление данными</h3>
                <button onclick="closeDataModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Сохраните резервную копию заметок и домашних заданий или загрузите готовый файл от одногруппников.</p>
            <div class="space-y-2 pt-2">
                <button onclick="exportData()" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-900/50 rounded-2xl text-xs font-semibold hover:bg-blue-100 dark:hover:bg-blue-900/60 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Скачать резервную копию (JSON)</span>
                </button>
                <label class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 rounded-2xl text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span>Загрузить данные из файла</span>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden" />
                </label>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ЛОГИКА -->
    <script>
        // БАЗА ДАННЫХ РАСПИСАНИЯ
        const baseSchedule = {
            1: { // Неделя 1
                1: [
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Физическая культура и спорт", type: "Лекция", room: "409", teacher: "Фирсин С.А." },
                    { num: 4, time: "14:20 – 15:50", endTime: "15:50", name: "День самоподготовки", type: "Самостоятельно", room: "-", teacher: "-" }
                ],
                2: [
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Философия", type: "Лекция", room: "210", teacher: "Заклинский П.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Философия", type: "Лекция", room: "210", teacher: "Заклинский П.А." }
                ],
                3: [
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Основы российской государственности", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Основы российской государственности", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "История России", type: "Лекция", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                4: [
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "Основы нравственности и воспитания (НКО)", type: "Лекция", room: "210", teacher: "Волович И.Г." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." }
                ],
                5: [
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "Экономическая теория", type: "Лекция", room: "409", teacher: "Башашкина Г.Ю." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "Иностранный язык", type: "Лекция", room: "401", teacher: "Пенькова Е.А." }
                ],
                6: [], 0: []
            },
            2: { // Неделя 2
                1: [
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Физическая культура и спорт", type: "Практика", room: "409", teacher: "Фирсин С.А." },
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Безопасность жизнедеятельности", type: "Практика", room: "205", teacher: "Макаршин И.В." }
                ],
                2: [
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Философия", type: "Практика", room: "206", teacher: "Заклинский П.А." }
                ],
                3: [
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Русский язык и культура речи", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Русский язык и культура речи", type: "Лекция", room: "210", teacher: "Кузьмичева Н.В." },
                    { num: "3-4", time: "12:40 – 15:50", endTime: "15:50", name: "История России", type: "Лекция", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                4: [
                    { num: "2-3", time: "10:40 – 14:10", endTime: "14:10", name: "Экономическая теория", type: "Практика", room: "401", teacher: "Башашкина Г.Ю." },
                    { num: 4, time: "14:20 – 15:50", endTime: "15:50", name: "Основы нравственности и воспитания (НКО)", type: "Лекция", room: "210", teacher: "Волович И.Г." },
                    { num: 5, time: "16:00 – 17:30", endTime: "17:30", name: "История России", type: "Практика", room: "205", teacher: "Королева-Конопляная Г.И." }
                ],
                5: [
                    { num: 1, time: "09:00 – 10:30", endTime: "10:30", name: "Иностранный язык", type: "Практика", room: "401", teacher: "Пенькова Е.А." },
                    { num: 2, time: "10:40 – 12:10", endTime: "12:10", name: "Безопасность жизнедеятельности", type: "Лекция", room: "210", teacher: "Макаршин И.В." },
                    { num: 3, time: "12:40 – 14:10", endTime: "14:10", name: "Безопасность жизнедеятельности", type: "Лекция", room: "210", teacher: "Макаршин И.В." }
                ],
                6: [
                    { num: "1-2", time: "09:00 – 12:10", endTime: "12:10", name: "Основы нравственности и воспитания (НКО)", type: "Практика", room: "210", teacher: "Волович И.Г." }
                ],
                0: []
            }
        };

        // Состояние
        let currentDate = new Date();
        let selectedDate = new Date();
        let searchQuery = "";
        let currentNoteKey = "";

        const semesterStartDate = new Date(2026, 8, 28); // 28.09.2026
        const dayNames = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        const fullDayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        // Инициализация
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            renderApp();
            setInterval(updateRealtime, 60000);
        });

        // ТЕМА (Dark/Light)
        function initTheme() {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark" || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add("dark");
                document.getElementById("themeIcon").setAttribute("data-lucide", "sun");
            } else {
                document.documentElement.classList.remove("dark");
                document.getElementById("themeIcon").setAttribute("data-lucide", "moon");
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("themeIcon").setAttribute("data-lucide", isDark ? "sun" : "moon");
            lucide.createIcons();
        }

        function getWeekNumber(date) {
            const diffDays = Math.floor((date - semesterStartDate) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 1;
            return (Math.floor(diffDays / 7) % 2) === 0 ? 1 : 2;
        }

        function renderApp() {
            renderHeaderAndDays();
            renderNextPairWidget();
            renderSchedule();
            lucide.createIcons();
        }

        function renderHeaderAndDays() {
            const weekNum = getWeekNumber(selectedDate);
            document.getElementById("weekLabel").innerText = `Неделя ${weekNum}`;

            const startOfWeek = new Date(selectedDate);
            const day = startOfWeek.getDay();
            const diffToMon = (day === 0 ? -6 : 1) - day;
            startOfWeek.setDate(startOfWeek.getDate() + diffToMon);

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);

            const formatDateShort = (d) => `${d.getDate()} ${d.toLocaleString('ru', { month: 'short' }).replace('.', '')}`;
            document.getElementById("dateRangeLabel").innerText = `${formatDateShort(startOfWeek)} – ${formatDateShort(endOfWeek)}`;

            const daysContainer = document.getElementById("daysContainer");
            daysContainer.innerHTML = "";

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(dayDate.getDate() + i);

                const isToday = isSameDay(dayDate, currentDate);
                const isSelected = isSameDay(dayDate, selectedDate);
                const dayIdx = dayDate.getDay();

                const dayBtn = document.createElement("button");
                dayBtn.onclick = () => { selectedDate = new Date(dayDate); renderApp(); };

                let btnClass = "flex flex-col items-center justify-center p-1.5 sm:p-2.5 rounded-2xl transition-all cursor-pointer font-medium ";
                if (isSelected) {
                    btnClass += "bg-blue-500 text-white shadow-md shadow-blue-500/20 scale-105 ";
                } else if (isToday) {
                    btnClass += "bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-700/50 ";
                } else {
                    btnClass += "bg-slate-100 dark:bg-slate-700/40 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 ";
                }

                dayBtn.className = btnClass;
                dayBtn.innerHTML = `
                    <span class="text-[10px] sm:text-xs opacity-75 uppercase">${dayNames[dayIdx]}</span>
                    <span class="text-xs sm:text-base font-bold">${dayDate.getDate()}</span>
                `;
                daysContainer.appendChild(dayBtn);
            }

            const selIdx = selectedDate.getDay();
            document.getElementById("selectedDayTitle").innerHTML = `
                <span>${fullDayNames[selIdx]}</span>
                <span class="text-xs font-normal text-slate-400 font-sans">, ${selectedDate.getDate()} ${selectedDate.toLocaleString('ru', { month: 'long' })}</span>
            `;
        }

        // Виджет «Следующая пара»
        function renderNextPairWidget() {
            const widget = document.getElementById("nextPairWidget");
            const weekNum = getWeekNumber(currentDate);
            const dayIdx = currentDate.getDay();
            const pairs = baseSchedule[weekNum]?.[dayIdx] || [];

            const nowMinutes = currentDate.getHours() * 60 + currentDate.getMinutes();
            let nextPair = null;

            for (let pair of pairs) {
                const [startStr] = pair.time.split("–").map(s => s.trim());
                const [h, m] = startStr.split(":").map(Number);
                if (h * 60 + m > nowMinutes) {
                    nextPair = pair;
                    break;
                }
            }

            if (nextPair) {
                widget.classList.remove("hidden");
                widget.innerHTML = `
                    <div class="flex items-center justify-between text-xs opacity-90">
                        <span class="font-semibold flex items-center gap-1"><i data-lucide="zap" class="w-3.5 h-3.5"></i> Следующая пара сегодня:</span>
                        <span class="bg-white/20 px-2 py-0.5 rounded-lg">${nextPair.time}</span>
                    </div>
                    <div class="text-sm font-bold">${nextPair.name}</div>
                    <div class="text-xs opacity-80">Аудитория: ${nextPair.room} • ${nextPair.teacher}</div>
                `;
            } else {
                widget.classList.add("hidden");
            }
        }

        // Рендер пар
        function renderSchedule() {
            const container = document.getElementById("scheduleContainer");
            container.innerHTML = "";

            const weekNum = getWeekNumber(selectedDate);
            const dayIdx = selectedDate.getDay();
            let pairs = baseSchedule[weekNum]?.[dayIdx] || [];

            // Фильтрация при поиске
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                pairs = pairs.filter(p => 
                    p.name.toLowerCase().includes(q) || 
                    p.room.toLowerCase().includes(q) || 
                    p.teacher.toLowerCase().includes(q)
                );
            }

            document.getElementById("pairsCount").innerText = pairs.length ? `${pairs.length} пары` : "Нет пар";

            if (pairs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md rounded-3xl p-8 text-center border border-white/60 dark:border-slate-700/60 shadow-sm space-y-2">
                        <div class="w-10 h-10 bg-blue-50 dark:bg-blue-950/60 rounded-2xl flex items-center justify-center mx-auto text-blue-500">
                            <i data-lucide="coffee" class="w-5 h-5"></i>
                        </div>
                        <p class="text-sm font-semibold">${searchQuery ? 'Ничего не найдено' : 'На этот день пар нет!'}</p>
                        <p class="text-xs text-slate-400">Свободное время для отдыха или задач.</p>
                    </div>
                `;
                return;
            }

            pairs.forEach((pair, index) => {
                const pairId = `hw_w${weekNum}_d${dayIdx}_p${pair.num}_${index}`;
                const savedHw = localStorage.getItem(pairId) || "";
                const isDone = localStorage.getItem(`${pairId}_done`) === "true";

                const teacherNote = localStorage.getItem(`note_t_${pair.teacher}`) || "";
                const roomNote = localStorage.getItem(`note_r_${pair.room}`) || "";

                const status = getPairStatus(pair, selectedDate);
                const daysLeft = getDaysUntilTargetDate(selectedDate);

                const card = document.createElement("div");
                let cardStyle = "bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-3xl p-4 sm:p-5 shadow-sm border transition-all space-y-3 relative ";

                if (status === "current") {
                    cardStyle += "border-blue-400 ring-4 ring-blue-400/20 bg-blue-50/20 dark:bg-blue-900/10 ";
                } else if (status === "passed") {
                    cardStyle += "border-slate-100 dark:border-slate-800 opacity-60 bg-slate-50/40 dark:bg-slate-900/30 ";
                } else {
                    cardStyle += "border-white/80 dark:border-slate-700/70 hover:shadow-md ";
                }

                card.className = cardStyle;

                let badgeStyle = "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300";
                if (pair.type === "Лекция") badgeStyle = "bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-800/50";
                if (pair.type === "Практика") badgeStyle = "bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50";

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="space-y-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[10px] sm:text-xs font-semibold px-2.5 py-0.5 rounded-xl ${badgeStyle}">${pair.type}</span>
                                ${status === "current" ? `
                                    <span class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-950 px-2 py-0.5 rounded-xl animate-pulse">
                                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> Идет сейчас
                                    </span>
                                ` : ''}
                            </div>
                            <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 pt-0.5">${pair.name}</h3>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <span class="text-[11px] font-bold text-slate-400 block">№ ${pair.num}</span>
                            <span class="text-[11px] font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 px-2 py-0.5 rounded-lg border border-blue-100 dark:border-blue-900/50 mt-0.5 inline-block">до ${pair.endTime}</span>
                        </div>
                    </div>

                    <!-- Детали (Аудитория / Преподаватель) -->
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-700/50">
                        <div class="flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5 opacity-60"></i>
                            <span>${pair.time}</span>
                        </div>
                        <div class="flex items-center gap-1.5 cursor-pointer hover:text-blue-500 transition-colors" onclick="openNoteModal('note_r_${pair.room}', 'Аудитория ${pair.room}')">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 opacity-60"></i>
                            <span>Ауд. <strong class="text-slate-700 dark:text-slate-200">${pair.room}</strong></span>
                            ${roomNote ? '<i data-lucide="sticky-note" class="w-3 h-3 text-amber-500 ml-1"></i>' : ''}
                        </div>
                        ${pair.teacher !== "-" ? `
                            <div class="flex items-center gap-1.5 col-span-2 cursor-pointer hover:text-blue-500 transition-colors" onclick="openNoteModal('note_t_${pair.teacher}', '${pair.teacher}')">
                                <i data-lucide="user" class="w-3.5 h-3.5 opacity-60"></i>
                                <span>${pair.teacher}</span>${teacherNote ? '<i data-lucide="sticky-note" class="w-3 h-3 text-amber-500 ml-1"></i>' : ''}
                            </div>
                        ` : ''}
                    </div>

                    <!-- Поле Домашнего Задания -->
                    <div class="pt-2 border-t border-slate-100 dark:border-slate-700/50 space-y-1.5">
                        <div class="flex items-center gap-2">
                            <input 
                                type="checkbox" 
                                ${isDone ? 'checked' : ''} 
                                onchange="toggleHwDone('${pairId}', this.checked)"
                                class="w-4 h-4 rounded-md text-blue-500 focus:ring-0 cursor-pointer accent-blue-500"
                            />
                            <input 
                                type="text" 
                                id="${pairId}"
                                value="${escapeHtml(savedHw)}"
                                placeholder="Добавить домашку..."
                                onblur="saveHomework('${pairId}', this.value)"
                                onkeypress="if(event.key==='Enter') this.blur()"
                                class="w-full text-xs bg-slate-50 dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-900 focus:bg-white dark:focus:bg-slate-900 text-slate-700 dark:text-slate-200 placeholder-slate-400 px-3 py-1.5 rounded-xl border border-slate-200/60 dark:border-slate-700/60 focus:border-blue-400 focus:outline-none transition-all ${isDone ? 'line-through opacity-50' : ''}"
                            />
                        </div>

                        <!-- Вывод дедлайна сдачи -->
                        ${savedHw ? `
                            <div class="flex items-center justify-between text-[10px] text-slate-400 px-1">
                                <span class="flex items-center gap-1">
                                    <i data-lucide="timer" class="w-3 h-3"></i> Сдача: ${formatDeadlineText(daysLeft)}
                                </span>
                                <span>${isDone ? '✓ Выполнено' : 'В процессе'}</span>
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // ЛОГИКА ДЗ И ДЕДЛАЙНОВ
        function saveHomework(id, text) {
            if (text.trim()) {
                localStorage.setItem(id, text.trim());
            } else {
                localStorage.removeItem(id);
                localStorage.removeItem(`${id}_done`);
            }
            renderSchedule();
            lucide.createIcons();
        }

        function toggleHwDone(id, isChecked) {
            localStorage.setItem(`${id}_done`, isChecked);
            renderSchedule();
            lucide.createIcons();
        }

        function getDaysUntilTargetDate(targetDate) {
            const today = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
            const target = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDeadlineText(days) {
            if (days < 0) return "Срок прошёл";
            if (days === 0) return "Сегодня!";
            if (days === 1) return "Завтра";
            return `через ${days} дн.`;
        }

        // МОДАЛЬНОЕ ОКНО ЗАМЕТОК
        function openNoteModal(key, title) {
            currentNoteKey = key;
            document.getElementById("noteModalTitle").innerText = `Заметка: ${title}`;
            document.getElementById("noteInput").value = localStorage.getItem(key) || "";
            document.getElementById("noteModal").classList.remove("hidden");
        }

        function closeNoteModal() {
            document.getElementById("noteModal").classList.add("hidden");
        }

        function saveNote() {
            const val = document.getElementById("noteInput").value.trim();
            if (val) {
                localStorage.setItem(currentNoteKey, val);
            } else {
                localStorage.removeItem(currentNoteKey);
            }
            closeNoteModal();
            renderSchedule();
            lucide.createIcons();
        }

        // ЭКСПОРТ И ИМПОРТ ДАННЫХ
        function openDataModal() { document.getElementById("dataModal").classList.remove("hidden"); }
        function closeDataModal() { document.getElementById("dataModal").classList.add("hidden"); }

        function exportData() {
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data[key] = localStorage.getItem(key);
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `schedule_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
                    alert("Данные успешно загружены!");
                    closeDataModal();
                    renderApp();
                } catch(err) {
                    alert("Ошибка чтения файла данных.");
                }
            };
            reader.readAsText(file);
        }

        // ПОИСК, НАВИГАЦИЯ И ВСПОМОГАТЕЛЬНЫЕ
        function onSearchInput(val) {
            searchQuery = val;
            renderSchedule();
            lucide.createIcons();
        }

        function getPairStatus(pair, targetDate) {
            if (!isSameDay(targetDate, currentDate)) return "future";
            const nowMin = currentDate.getHours() * 60 + currentDate.getMinutes();
            const [startStr, endStr] = pair.time.split("–").map(s => s.trim());
            const [sh, sm] = startStr.split(":").map(Number);
            const [eh, em] = endStr.split(":").map(Number);

            const startMin = sh * 60 + sm;
            const endMin = eh * 60 + em;

            if (nowMin >= startMin && nowMin <= endMin) return "current";
            if (nowMin > endMin) return "passed";
            return "future";
        }

        function changeWeek(dir) {
            selectedDate.setDate(selectedDate.getDate() + (dir * 7));
            renderApp();
        }

        function goToToday() {
            currentDate = new Date();
            selectedDate = new Date();
            renderApp();
        }

        function updateRealtime() {
            currentDate = new Date();
            renderApp();
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
